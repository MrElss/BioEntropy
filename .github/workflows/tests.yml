name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BioEntropy_Final_Package
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # requirements files live in the package subdir, not the repo root,
          # and are not named requirements.txt, so point the pip cache at them.
          cache-dependency-path: BioEntropy_Final_Package/requirements_dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run test suite
        env:
          MPLBACKEND: Agg
        run: pytest tests/ -q
