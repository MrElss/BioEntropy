name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: BioEntropy_Final_Package
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          # requirements files live in the package subdir, not the repo root,
          # and are not named requirements.txt, so point the pip cache at them.
          cache-dependency-path: |
            BioEntropy_Final_Package/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python }}" = "3.12" ]; then
            pip install -r requirements_dev_lock.txt
          else
            pip install -r requirements_dev.txt
          fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Run test suite
        env:
          MPLBACKEND: Agg
        run: pytest tests/ -q
